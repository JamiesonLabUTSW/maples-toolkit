name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-check:
    name: Python lint and format check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install developer tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - name: Run Python checks
        run: make python-check

  markdown-check:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install developer tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - name: Run Markdown checks
        run: make markdown-check

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install developer tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - name: Run type checks
        run: make typecheck

  marketplace:
    name: Marketplace validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install developer tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - name: Run marketplace checks
        run: make smoke
      - name: Run version checks
        run: make version-check
      - name: Run changelog checks
        run: make changelog-check
