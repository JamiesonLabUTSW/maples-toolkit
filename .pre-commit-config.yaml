repos:
  - repo: local
    hooks:
      - id: make-python-check
        name: make python-check
        entry: make python-check
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: make-markdown-check
        name: make markdown-check
        entry: make markdown-check
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: make-typecheck
        name: make typecheck
        entry: make typecheck
        language: system
        pass_filenames: false
        stages: [pre-commit]
